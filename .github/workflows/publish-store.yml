name: Publish to ConjureOS App Store

# Builds Conjure Fitness to a single self-contained HTML file and publishes a
# new App Store version via the shared composite action in the conjureos repo.
#
# DEV ONLY for now (owner decision, 2026-09-28): the one trigger is Run
# workflow, and it publishes to the DEV project (dev.conjureos.pages.dev).
# There is no release trigger and no prod option. To ship to prod later, add
# them back the way Jonny-B/conjureos-health's workflow has them.
#
# The store slug is `conjure-fitness`, a new listing. NEVER set it back to
# `fitness`: that slug is Conjure Health's listing (Jonny-B/conjureos-health),
# and publishing to it would replace Health for everyone who has it installed.
#
# Secrets this repo needs (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DEV_PROJECT_REF, PUBLISH_BOT_DEV_PASSWORD
#   CONJUREOS_REPO_TOKEN  (read-only access to Jonny-B/ConjureOS, see below)
# The anon key + bot email are public/non-secret and inlined below. See
# ANCHOR_APP_CI_SETUP.md in the conjureos repo.

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Changelog for this version
        required: false
        default: ""

concurrency:
  group: publish-store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      # No VITE_SUPABASE_* here: the app never uses the shared backend (its
      # `fitness` schema is Conjure Health's; see src/data/repository.ts).
      - name: Build single-file HTML
        run: npm run build:inline

      - name: Resolve changelog
        id: changelog
        # Read the dispatch text via an env var, NOT ${{ }} interpolation:
        # backticks and quotes otherwise land in the shell as command
        # substitution (same fix conjureos-app-recipes took, DECISIONS
        # 2026-06-21).
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.changelog }}
        run: |
          {
            echo "text<<__CHANGELOG__"
            echo "$DISPATCH_INPUT"
            echo "__CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

      # The shared publish action lives in the (private) ConjureOS repo. GitHub
      # can't resolve an action in another private *personal* repo via
      # `uses: Jonny-B/ConjureOS/...@dev`, so check ConjureOS out with a
      # read-only PAT and reference the action by local path below.
      - name: Checkout ConjureOS (shared publish action)
        uses: actions/checkout@v4
        with:
          repository: Jonny-B/ConjureOS
          ref: dev
          token: ${{ secrets.CONJUREOS_REPO_TOKEN }}
          path: .conjureos

      - name: Publish to App Store (dev)
        uses: ./.conjureos/.github/actions/publish-anchor-app
        with:
          supabase-url: https://${{ secrets.SUPABASE_DEV_PROJECT_REF }}.supabase.co
          # Anon key is public by design (shipped in every browser); RLS applies.
          supabase-anon-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcHZqbHN5d3JwdGVmZ3d1enRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTA3OTMsImV4cCI6MjA5NTQ4Njc5M30.ITZjX5KkMNgbJuFEHS5-IqFFJC6A39OynVgOznZeqD8
          bot-email: conjureosbot@gmail.com
          bot-password: ${{ secrets.PUBLISH_BOT_DEV_PASSWORD }}
          html-path: dist/index.html
          slug: conjure-fitness
          changelog: ${{ steps.changelog.outputs.text }}
